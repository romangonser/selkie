    function teilDetailSheet(tid) {
      const t = daten.teile[tid];
      if (!t) return;
      const { inhalt, schliessen } = sheet(t.name, (KAT[t.kategorie] || {}).name);
      const bild = el("div", "detail-bild");
      bild.appendChild(teilBild(t));
      inhalt.appendChild(bild);
      inhalt.appendChild(tagPills(t));
      const getragen = liste(daten.outfits).filter((o) => (o.teile || []).includes(tid)).length;
      inhalt.appendChild(el("p", "klein gedaempft", getragen ? "In " + getragen + (getragen === 1 ? " Outfit" : " Outfits") + " im Lookbook." : "Noch in keinem Outfit im Lookbook."));
      const anziehen = el("button", "btn breit", "In Dress Me anziehen");
      anziehen.onclick = () => {
        const gruppe = gruppeVon(t);
        // Accessoires ergänzen sich (mehrere gleichzeitig tragbar); bei allem anderen ersetzt
        // das neue Teil nur, was in derselben Gruppe sitzt (z. B. Oberteil ersetzt Oberteil).
        const ids = aktuelleTeile().filter((x) => x !== tid && (gruppe === "acc" || gruppeVon(daten.teile[x]) !== gruppe));
        outfitAnziehen(ids.concat(tid));
      };
      const reihe = el("div", "btn-reihe");
      const bearbeiten = el("button", "btn outline", "Bearbeiten");
      bearbeiten.onclick = () => { schliessen(); teilBearbeitenSheet(tid); };
      const loeschen = el("button", "btn gefahr", "Löschen");
      loeschen.onclick = async () => {
        if (!(await bestaetigen("«" + t.name + "» aus dem Schrank löschen?", "Löschen"))) return;
        if (t.bild && t.bild.indexOf("bild:") === 0) bildLoeschen(t.bild.slice(5));
        delete daten.teile[tid];
        speichern("teile/" + tid, null);
        schliessen();
        anzeigen();
        toast("Gelöscht.");
      };
      reihe.append(bearbeiten, loeschen);
      inhalt.append(anziehen, reihe);
    }
    function gruppeVon(t) {
      if (t.kategorie === "accessoire") return "acc";
      return Object.keys(GRUPPEN).find((g) => GRUPPEN[g].kategorien.includes(t.kategorie));
    }

    // Foto aufnehmen oder auswählen. Mit «freistellen» wird der Hintergrund automatisch entfernt (abschaltbar).
    function fotoWaehler(start, onFoto, freistellen) {
      const huelle = el("div", "chip-gruppe");
      const box = el("div", "foto-wahl" + (start ? " hat-bild" : ""));
      huelle.appendChild(box);
      const vorschau = start ? bildElement(start) : null;
      if (vorschau) { vorschau.classList.remove("foto"); box.appendChild(vorschau); }
      const hinweis = el("div", "klein gedaempft", "Am besten flach vor einem hellen, einfarbigen Hintergrund fotografieren.");
      const kamera = el("input"); kamera.type = "file"; kamera.accept = "image/*"; kamera.setAttribute("capture", "environment"); kamera.hidden = true;
      const galerie = el("input"); galerie.type = "file"; galerie.accept = "image/*"; galerie.hidden = true;
      const reihe = el("div", "btn-reihe");
      const b1 = el("button", "btn klein", "Foto aufnehmen"); b1.type = "button"; b1.onclick = () => kamera.click();
      const b2 = el("button", "btn klein outline", "Aus Galerie"); b2.type = "button"; b2.onclick = () => galerie.click();
      reihe.append(b1, b2);
      if (!start) box.appendChild(icon("plus", "ic-32"));
      box.append(reihe, kamera, galerie);
      if (!start) box.appendChild(hinweis);
      const schalter = el("label", "liste-zeile verborgen");
      schalter.style.cursor = "pointer";
      const cb = el("input"); cb.type = "checkbox"; cb.checked = true; cb.style.cssText = "width:22px;height:22px;accent-color:#091516";
      schalter.append(el("span", "klein", "Hintergrund automatisch entfernen"), cb);
      huelle.appendChild(schalter);
      let ergebnis = null;
      function zeigen() {
        if (!ergebnis) return;
        const frei = !!(ergebnis.frei && cb.checked);
        const src = frei ? ergebnis.frei : ergebnis.normal;
        box.querySelectorAll("img, .ic, .klein").forEach((x) => x.remove());
        const img = el("img"); img.src = src; img.alt = "";
        box.style.background = frei ? "repeating-conic-gradient(#f4f1ef 0 25%, #ede0df 0 50%) 0 0 / 18px 18px" : "";
        if (frei) img.style.background = "transparent";
        box.insertBefore(img, box.firstChild);
        box.classList.add("hat-bild");
        onFoto({ data: src, freigestellt: frei });
      }
      cb.onchange = zeigen;
      async function gewaehlt(e) {
        const datei = e.target.files && e.target.files[0];
        if (!datei) return;
        try {
          if (freistellen) ergebnis = await fotoFuerTeil(datei);
          else ergebnis = { normal: await fotoVerkleinern(datei), frei: null };
          schalter.classList.toggle("verborgen", !ergebnis.frei);
          zeigen();
        } catch (f) { toast(f.message); }
      }
      kamera.onchange = gewaehlt;
      galerie.onchange = gewaehlt;
      return huelle;
    }

    function teilBearbeitenSheet(tid) {
      const alt = tid ? daten.teile[tid] : null;
      const { inhalt, schliessen } = sheet(alt ? "Teil bearbeiten" : "Neues Teil", alt ? alt.name : "In den Schrank");
      const neu = {
        name: alt ? alt.name : "",
        kategorie: alt ? alt.kategorie : null,
        wetter: alt ? (alt.wetter || []).slice() : [],
        temperatur: alt ? (alt.temperatur || []).slice() : [],
        tags: alt ? (alt.tags || []).slice() : [],
      };
      let neuesFoto = null;
      inhalt.appendChild(fotoWaehler(alt ? alt.bild : null, (d) => { neuesFoto = d; }, true));

      const name = el("input"); name.placeholder = "z. B. Trenchcoat Camel"; name.value = neu.name; name.maxLength = 60;
      inhalt.appendChild(feld("Name", name));

      const kats = el("div", "kat-raster");
      function katZeichnen() {
        kats.innerHTML = "";
        KATEGORIEN.forEach((k) => {
          const b = el("button", "kat" + (neu.kategorie === k.id ? " aktiv" : ""));
          b.type = "button";
          b.append(icon(k.icon, "ic-32"), el("span", "klein", k.name));
          b.onclick = () => { neu.kategorie = k.id; katZeichnen(); };
          kats.appendChild(b);
        });
      }
      katZeichnen();
      inhalt.appendChild(gruppe("Was ist es?", kats));
      inhalt.appendChild(gruppe("Wetter", auswahlChips(WETTER, neu.wetter, true, (v) => { neu.wetter = v; }), "Beides wählen, wenn es zu jedem Wetter passt."));
      inhalt.appendChild(gruppe("Temperatur", auswahlChips(TEMPERATUR, neu.temperatur, true, (v) => { neu.temperatur = v; })));
      inhalt.appendChild(gruppe("Eigene Tags", tagAuswahl(neu.tags, (v) => { neu.tags = v; })));
      const fehler = el("p", "fehler-text");
      inhalt.appendChild(fehler);
      const ok = el("button", "btn breit", alt ? "Speichern" : "In den Schrank legen");
      ok.onclick = async () => {
        neu.name = name.value.trim();
        if (!alt && !neuesFoto) { fehler.textContent = "Bitte zuerst ein Foto aufnehmen oder auswählen."; return; }
        if (!neu.kategorie) { fehler.textContent = "Bitte wähle aus, was es ist (z. B. Hose oder Shirt)."; return; }
        if (!neu.name) neu.name = KAT[neu.kategorie].name;
        if (!neu.wetter.length) neu.wetter = ["sonne", "regen"];
        if (!neu.temperatur.length) neu.temperatur = ["warm", "kalt"];
        ok.disabled = true; ok.textContent = "Speichert …";
        try {
          const teilId = tid || id();
          let bild = alt ? alt.bild : null;
          if (neuesFoto) {
            const bid = id();
            await bildSpeichern(bid, neuesFoto.data);
            if (alt && alt.bild && alt.bild.indexOf("bild:") === 0) bildLoeschen(alt.bild.slice(5));
            bild = "bild:" + bid;
          }
          const teil = Object.assign({}, alt || {}, neu, { bild, erstellt: alt ? alt.erstellt : Date.now() });
          if (neuesFoto) { delete teil.vorlage; teil.freigestellt = neuesFoto.freigestellt; }
          daten.teile[teilId] = teil;
          const gesichert = await speichern("teile/" + teilId, teil);
          schliessen();
          ui.schrankKat = "alle";
          anzeigen();
          if (gesichert) toast(alt ? "Gespeichert." : "«" + teil.name + "» liegt jetzt im Schrank.");
        } catch (f) {
          fehler.textContent = f.message;
          ok.disabled = false; ok.textContent = "Nochmals versuchen";
        }
      };
      inhalt.appendChild(ok);
    }

    function outfitSpeichernSheet(oid) {
      const alt = oid ? daten.outfits[oid] : null;
      const teile = alt ? (alt.teile || []).slice() : aktuelleTeile();
      if (!teile.length) { toast("Stell zuerst ein Outfit zusammen."); return; }
      const { inhalt, schliessen } = sheet(alt ? "Look bearbeiten" : "Im Lookbook speichern", alt ? datumText(alt.datum) : "Outfit getragen");
      // Wetter/Temperatur aus den Teilen vorschlagen
      const gemeinsam = (feld, alle) => alle.filter((w) => teile.every((x) => (daten.teile[x] && daten.teile[x][feld] || []).includes(w)));
      const neu = {
        name: alt ? alt.name : "",
        datum: alt ? alt.datum : heute(),
        notiz: alt ? alt.notiz || "" : "",
        wetter: alt ? (alt.wetter || []).slice() : (ui.filter.wetter.length ? ui.filter.wetter.slice() : gemeinsam("wetter", ["sonne", "regen"])),
        temperatur: alt ? (alt.temperatur || []).slice() : (ui.filter.temperatur.length ? ui.filter.temperatur.slice() : gemeinsam("temperatur", ["warm", "kalt"])),
        tags: alt ? (alt.tags || []).slice() : (ui.filter.tags || []).slice(),
      };
      let foto = null;
      inhalt.appendChild(collage({ teile }));

      const name = el("input"); name.placeholder = "z. B. Büro Montag"; name.value = neu.name; name.maxLength = 60;
      const datum = el("input"); datum.type = "date"; datum.value = neu.datum;
      inhalt.append(feld("Name des Looks", name), feld("Getragen am", datum));
      inhalt.appendChild(gruppe("Wetter", auswahlChips(WETTER, neu.wetter, true, (v) => { neu.wetter = v; })));
      inhalt.appendChild(gruppe("Temperatur", auswahlChips(TEMPERATUR, neu.temperatur, true, (v) => { neu.temperatur = v; })));
      inhalt.appendChild(gruppe("Eigene Tags", tagAuswahl(neu.tags, (v) => { neu.tags = v; })));
      const notiz = el("textarea"); notiz.placeholder = "z. B. mit brauner Uhr tragen"; notiz.value = neu.notiz;
      inhalt.appendChild(feld("Notiz", notiz));
      if (!alt) inhalt.appendChild(gruppe("Foto vom Outfit (optional)", fotoWaehler(null, (d) => { foto = d.data; })));

      const fehler = el("p", "fehler-text");
      inhalt.appendChild(fehler);
      const ok = el("button", "btn breit", alt ? "Speichern" : "Im Lookbook speichern");
      ok.onclick = async () => {
        ok.disabled = true; ok.textContent = "Speichert …";
        try {
          const outfitId = oid || id();
          const o = Object.assign({}, alt || {}, {
            name: name.value.trim() || "Look vom " + new Date((datum.value || heute()) + "T12:00:00").toLocaleDateString("de-CH", { day: "numeric", month: "numeric" }),
            datum: datum.value || heute(),
            notiz: notiz.value.trim(),
            wetter: neu.wetter, temperatur: neu.temperatur, tags: neu.tags,
            teile, erstellt: alt ? alt.erstellt : Date.now(),
          });
          if (foto) { const bid = id(); await bildSpeichern(bid, foto); o.foto = "bild:" + bid; }
          daten.outfits[outfitId] = o;
          const gesichert = await speichern("outfits/" + outfitId, o);
          schliessen();
          if (!alt) { ui.seite = "lookbook"; ui.filter = { wetter: [], temperatur: [], tags: [] }; }
          anzeigen();
          if (gesichert) toast(alt ? "Gespeichert." : "Im Lookbook gespeichert.");
        } catch (f) {
          fehler.textContent = f.message; ok.disabled = false; ok.textContent = "Nochmals versuchen";
        }
      };
      inhalt.appendChild(ok);
    }

    function outfitDetailSheet(oid) {
      const o = daten.outfits[oid];
      if (!o) return;
      const { inhalt, schliessen } = sheet(o.name || "Look", datumText(o.datum));
      inhalt.appendChild(collage(o));
      if (o.notiz) inhalt.appendChild(el("p", "", o.notiz));
      const tags = tagPills(o);
      if (tags.childNodes.length) inhalt.appendChild(tags);
      const teileBox = el("div");
      teileBox.appendChild(el("div", "caption", "Teile in diesem Outfit"));
      (o.teile || []).forEach((tid) => {
        const t = daten.teile[tid];
        const z = el("div", "liste-zeile");
        z.append(el("span", "", t ? t.name : "(nicht mehr im Schrank)"), el("span", "caption gedaempft", t ? (KAT[t.kategorie] || {}).name : ""));
        teileBox.appendChild(z);
      });
      inhalt.appendChild(teileBox);
      const nochmals = el("button", "btn breit", "Nochmals anziehen");
      nochmals.onclick = () => outfitAnziehen((o.teile || []).filter((x) => daten.teile[x]));
      const reihe = el("div", "btn-reihe");
      const bearbeiten = el("button", "btn outline", "Bearbeiten");
      bearbeiten.onclick = () => { schliessen(); outfitSpeichernSheet(oid); };
      const loeschen = el("button", "btn gefahr", "Löschen");
      loeschen.onclick = async () => {
        if (!(await bestaetigen("Diesen Look aus dem Lookbook löschen?", "Löschen"))) return;
        if (o.foto) bildLoeschen(o.foto.slice(5));
        delete daten.outfits[oid];
        speichern("outfits/" + oid, null);
        schliessen(); anzeigen(); toast("Gelöscht.");
      };
      reihe.append(bearbeiten, loeschen);
      inhalt.append(nochmals, reihe);
    }

    function profilSheet() {
      const { inhalt, schliessen } = sheet("Profil", cloudAktiv() ? geraet.konto.email : "Nur auf diesem Gerät");
      const name = el("input"); name.value = daten.profil.name || ""; name.placeholder = "Dein Vorname"; name.maxLength = 40;
      inhalt.appendChild(feld("Name", name));



      const ok = el("button", "btn breit", "Speichern");
      ok.onclick = () => {
        daten.profil.name = name.value.trim();
        speichern("profil", daten.profil);
        schliessen(); anzeigen(); toast("Gespeichert.");
      };
      inhalt.appendChild(ok);

      const stats = el("div");
      const z1 = el("div", "liste-zeile"); z1.append(el("span", "", "Teile im Schrank"), el("span", "label", String(liste(daten.teile).length)));
      const z2 = el("div", "liste-zeile"); z2.append(el("span", "", "Looks im Lookbook"), el("span", "label", String(liste(daten.outfits).length)));
      stats.append(z1, z2);
      const hatVorlagen = liste(daten.teile).some((t) => t.vorlage);
      const z3 = el("div", "liste-zeile");
      const vb = el("button", "btn klein outline", hatVorlagen ? "Entfernen" : "Laden");
      vb.onclick = async () => {
        if (hatVorlagen) { if (!(await bestaetigen("Alle Beispiel-Kleider aus dem Schrank entfernen? Deine eigenen Teile bleiben.", "Entfernen"))) return; vorlagenEntfernen(); }
        else vorlagenLaden();
        schliessen(); anzeigen();
      };
      z3.append(el("span", "", "Beispiel-Kleider"), vb);
      stats.appendChild(z3);
      inhalt.appendChild(stats);

      if (cloudAktiv()) {
        const ab = el("button", "btn outline breit", "Abmelden");
        ab.onclick = async () => { if (await bestaetigen("Abmelden? Deine Kleider bleiben in deinem Konto gespeichert.", "Abmelden")) abmelden(); };
        inhalt.appendChild(ab);
      } else {
        inhalt.appendChild(el("p", "klein gedaempft", "Du nutzt Selkie gerade ohne Konto. Alles bleibt nur in diesem Browser gespeichert."));
        const wechsel = el("button", "btn outline breit", "Mit Konto anmelden");
        wechsel.onclick = async () => {
          if (!(await bestaetigen("Zur Anmeldung wechseln? Was du ohne Konto erfasst hast, wird dabei nicht übernommen.", "Wechseln"))) return;
          geraet.modus = null; geraetSpeichern();
          try { localStorage.removeItem(DATEN_KEY); } catch (f) { /* egal */ }
          location.reload();
        };
        inhalt.appendChild(wechsel);
      }
    }

    // ---------- Start / Anmeldung ----------
    function startSeite() {
      const s = el("div", "start");
      const kopf = el("div", "start-kopf");
      kopf.appendChild(el("div", "caption", "Selkie · My Style"));
      const mh = el("h1", "masthead");
      mh.append(document.createTextNode("The way"), el("em", "", "she wears"), document.createTextNode("it"));
      kopf.appendChild(mh);
      kopf.appendChild(el("p", "unterzeile", "Dein Schrank, deine Outfits, dein Lookbook. Dress me."));
      const figuren = el("div", "start-figuren");
      ["frau", "mann"].forEach((f) => { const i = el("img"); i.src = "assets/mannequin-" + f + ".png"; i.alt = ""; figuren.appendChild(i); });
      kopf.appendChild(figuren);
      s.appendChild(kopf);

      const form = el("div", "start-form");
      s.appendChild(form);
      app.appendChild(s);

      const kontoBereit = !!(geraet.konto.dbUrl && geraet.konto.apiKey);
      if (kontoBereit) anmeldeFormular(form);
      else einrichtenAuswahl(form);
    }

    function anmeldeFormular(form) {
      let modus = "anmelden";
      function zeichnen() {
        form.innerHTML = "";
        const um = el("div", "umschalter");
        [["anmelden", "Anmelden"], ["registrieren", "Neues Konto"]].forEach(([m, t]) => {
          const b = el("button", modus === m ? "aktiv" : "", t);
          b.onclick = () => { modus = m; zeichnen(); };
          um.appendChild(b);
        });
        form.appendChild(um);
        const name = el("input"); name.placeholder = "Dein Vorname"; name.autocomplete = "given-name";
        if (modus === "registrieren") form.appendChild(feld("Vorname", name));
        const mail = el("input"); mail.type = "email"; mail.autocomplete = "email"; mail.placeholder = "name@mail.ch";
        const pw = el("input"); pw.type = "password"; pw.autocomplete = modus === "anmelden" ? "current-password" : "new-password"; pw.placeholder = modus === "anmelden" ? "Passwort" : "mind. 6 Zeichen";
        form.append(feld("E-Mail", mail), feld("Passwort", pw));
        const fehler = el("p", "fehler-text");
        form.appendChild(fehler);
        const ok = el("button", "btn breit", modus === "anmelden" ? "Anmelden" : "Konto erstellen");
        ok.onclick = async () => {
          fehler.textContent = "";
          if (!mail.value.trim() || !pw.value) { fehler.textContent = "Bitte E-Mail und Passwort eingeben."; return; }
          ok.disabled = true; ok.textContent = "Einen Moment …";
          try {
            if (modus === "anmelden") await anmelden(mail.value, pw.value);
            else await registrieren(mail.value, pw.value);
            await datenLaden();
            if (modus === "registrieren" && name.value.trim()) { daten.profil.name = name.value.trim(); speichern("profil", daten.profil); }
            anzeigen();
          } catch (f) {
            fehler.textContent = f.message;
            ok.disabled = false; ok.textContent = modus === "anmelden" ? "Anmelden" : "Konto erstellen";
          }
        };
        pw.addEventListener("keydown", (e) => { if (e.key === "Enter") ok.click(); });
        form.appendChild(ok);
        if (modus === "anmelden") {
          const vergessen = el("button", "link-btn klein", "Passwort vergessen?");
          vergessen.onclick = async () => {
            if (!mail.value.trim()) { fehler.textContent = "Gib zuerst deine E-Mail ein."; return; }
            try { await authAnfrage("sendOobCode", { requestType: "PASSWORD_RESET", email: mail.value.trim() }); toast("Wir haben dir eine E-Mail geschickt."); }
            catch (f) { fehler.textContent = f.message; }
          };
          form.appendChild(vergessen);
        }
        if (!FIREBASE_FEST) {
          const zurueck = el("button", "link-btn klein", "Firebase-Zugang ändern");
          zurueck.onclick = () => { geraet.konto.dbUrl = ""; geraet.konto.apiKey = ""; geraetSpeichern(); anzeigen(); };
          form.appendChild(zurueck);
        }
      }
      zeichnen();
    }

    function einrichtenAuswahl(form) {
      form.innerHTML = "";
      form.appendChild(el("h2", "title-italic", "Willkommen"));
      form.appendChild(el("p", "klein", "Damit jede Person ihren eigenen Schrank auf allen Geräten hat, braucht Selkie einen kostenlosen Speicher mit Anmeldung (Firebase). Du kannst die App aber sofort ausprobieren."));
      const probieren = el("button", "btn breit", "Ohne Konto ausprobieren");
      probieren.onclick = async () => { geraet.modus = "lokal"; geraetSpeichern(); await datenLaden(); anzeigen(); };
      const einrichten = el("button", "btn outline breit", "Firebase einrichten");
      einrichten.onclick = () => firebaseFormular(form);
      form.append(probieren, einrichten);
    }

    function firebaseFormular(form) {
      form.innerHTML = "";
      form.appendChild(el("h2", "title-italic", "Firebase einrichten"));
      const ol = el("ol", "schritte");
      [
        "Auf console.firebase.google.com ein neues Projekt anlegen, z. B. «selkie».",
        "«Build» → «Authentication» → «Get started» → «E-Mail/Passwort» einschalten.",
        "«Build» → «Realtime Database» → «Datenbank erstellen» (Standort Europa, gesperrter Modus).",
        "Bei «Regeln» den Text unten einfügen und veröffentlichen.",
        "Projekteinstellungen (Zahnrad) → «Allgemein»: Den Web-API-Schlüssel kopieren. Gibt es noch keine Web-App, zuerst eine anlegen (Symbol </>).",
      ].forEach((t) => ol.appendChild(el("li", "", t)));
      form.appendChild(ol);
      const regeln = el("pre", "code", JSON.stringify({ rules: { selkie: { $uid: { ".read": "auth != null && auth.uid === $uid", ".write": "auth != null && auth.uid === $uid" } } } }, null, 2));
      form.appendChild(regeln);
      const url = el("input"); url.placeholder = "https://….firebasedatabase.app";
      const key = el("input"); key.placeholder = "AIza…";
      const urlFeld = feld("Adresse der Datenbank", url);
      const keyFeld = feld("Web-API-Schlüssel", key);
      const fehler = el("p", "fehler-text");
      const ok = el("button", "btn breit", "Weiter zur Anmeldung");
      ok.onclick = () => {
        const u = url.value.trim().replace(/\/+$/, "");
        const k = key.value.trim();
        if (!/^https:\/\/.+\.(firebasedatabase\.app|firebaseio\.com)$/.test(u)) { fehler.textContent = "Die Adresse muss mit https:// beginnen und auf firebasedatabase.app oder firebaseio.com enden."; return; }
        if (k.length < 20) { fehler.textContent = "Der Web-API-Schlüssel sieht nicht vollständig aus."; return; }
        geraet.konto.dbUrl = u; geraet.konto.apiKey = k; geraetSpeichern();
        anzeigen();
      };
      const zurueck = el("button", "link-btn klein", "Zurück");
      zurueck.onclick = () => einrichtenAuswahl(form);
      form.append(urlFeld, keyFeld, fehler, ok, zurueck);
    }

    // ---------- Start ----------
    (async function start() {
      if (geraet.modus) await datenLaden();
      anzeigen();
    })();
  </script>
</body>
</html>
